    <script>
        let currentZoom = 1.0;
        const minZoom = 0.3;
        const maxZoom = 3.0;
        
        function zoomIn() {
            currentZoom = Math.min(currentZoom + 0.1, maxZoom);
            applySvgZoom();
        }
        
        function zoomOut() {
            currentZoom = Math.max(currentZoom - 0.1, minZoom);
            applySvgZoom();
        }
        
        function resetZoom() {
            // Usa scale 1.0 come default per evitare tagli del contenuto
            // L'ingrandimento viene gestito dalle dimensioni del container
            currentZoom = 1.0;
            applySvgZoom();
        }
        
        function applySvgZoom() {
            const svg = document.querySelector('svg');
            if (svg) {
                svg.style.transform = `scale(${currentZoom})`;
                
                // Usa sempre le dimensioni massime per il container
                const container = document.getElementById('pageContainer');
                container.style.maxWidth = '99vw';
                container.style.maxHeight = '98vh';
                
                // Assicurati che l'SVG utilizzi tutto lo spazio disponibile
                svg.style.maxWidth = '99vw';
                svg.style.maxHeight = '98vh';
            }
        }
        
        // Keyboard zoom controls
        document.addEventListener('keydown', function(e) {
            if (e.key === '+' || e.key === '=') {
                e.preventDefault();
                zoomIn();
            } else if (e.key === '-') {
                e.preventDefault();
                zoomOut();
            } else if (e.key === '0') {
                e.preventDefault();
                resetZoom();
            }
        });
        
        // Mouse wheel zoom
        document.addEventListener('wheel', function(e) {
            if (e.ctrlKey) {
                e.preventDefault();
                if (e.deltaY < 0) {
                    zoomIn();
                } else {
                    zoomOut();
                }
            }
        });
        
        // Initialize zoom based on screen size and orientation
        document.addEventListener('DOMContentLoaded', function() {
            resetZoom();
        });
        
        // Handle window resize
        window.addEventListener('resize', function() {
            resetZoom();
        });
    </script>
